name: 'Download Kernel Repository'
description: 'Initialize and sync Android kernel source repository'

inputs:
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 5.15, 6.1)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g., 2024-01)'
    required: true
  kernel_source:
    description: 'Kernel source provider (google/wild)'
    required: false
    default: 'google'

outputs:
  deprecated_branch:
    description: 'Whether the kernel branch is deprecated'
    value: ${{ steps.sync.outputs.deprecated }}

  tag_fallback:
    description: 'Release tag used when the branch head was missing upstream'
    value: ${{ steps.sync.outputs.tag_fallback }}

runs:
  using: composite

  steps:

    - name: Initialize and Sync Kernel Repository
      id: sync
      shell: bash
      working-directory: ${{ github.workspace }}/kernel

      run: |

        set -euo pipefail

        VERSION="${{ inputs.version }}"

        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)

        FORMATTED_BRANCH="${ANDROID_PART}-${KERNEL_PART}-${{ inputs.os_patch_level }}"

        SOURCE="${{ inputs.kernel_source }}"

        echo "[+] Kernel source: $SOURCE"


        init_source_repo() {

          local depth="$1"

          local depth_flag=""

          if [ "$depth" != "0" ]; then
            depth_flag="--depth=${depth}"
          fi


          case "$SOURCE" in


          google)

            echo "[+] Using Google GKI manifest"


            repo init \
              -u https://android.googlesource.com/kernel/manifest \
              -b common-${FORMATTED_BRANCH} \
              ${depth_flag}

            ;;



          wild)

            echo "[+] Using WildKernel manifest"


            repo init \
              -u https://github.com/WildKernels/kernel_manifest.git \
              -b common-${FORMATTED_BRANCH} \
              ${depth_flag}

            ;;



          *)

            echo "ERROR: Unknown kernel source '$SOURCE'"
            echo "Available:"
            echo " google"
            echo " wild"

            exit 1

            ;;

          esac

        }



        init_repo() {

          local depth="$1"


          init_source_repo "$depth"


          DEPRECATED=false
          TAG_FALLBACK=""


          if [ "$SOURCE" = "google" ]; then


            REMOTE_BRANCH=$(git ls-remote \
              https://android.googlesource.com/kernel/common \
              ${FORMATTED_BRANCH} || true)


            if grep -q deprecated <<< "$REMOTE_BRANCH"; then

              sed -i \
              "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" \
              .repo/manifests/default.xml


              DEPRECATED=true

            fi


          fi


          echo "deprecated=$DEPRECATED" >> $GITHUB_OUTPUT

          echo "tag_fallback=$TAG_FALLBACK" >> $GITHUB_OUTPUT

        }



        SYNC_TIME="15m"

        MAX_RETRIES=3

        RETRY_DELAY_SHORT=5


        attempt=1


        while [ $attempt -le $MAX_RETRIES ]; do


          echo "Attempt $attempt/$MAX_RETRIES"


          if init_repo 1; then


            if timeout $SYNC_TIME repo sync \
              -c \
              --current-branch \
              --no-clone-bundle \
              --jobs-checkout=4 \
              -j4; then


              echo "Kernel sync completed"

              break


            fi

          fi



          if [ $attempt -eq $MAX_RETRIES ]; then

            echo "Kernel sync failed"

            exit 1

          fi



          echo "Retrying..."

          rm -rf .repo

          sleep $RETRY_DELAY_SHORT


          attempt=$((attempt+1))


        done



    - name: Capture Kernel Common Commit Metadata

      shell: bash

      working-directory: ${{ github.workspace }}/kernel

      run: |

        set -euo pipefail


        if [ ! -d common ]; then
          echo "WARNING: common folder missing"
          exit 0
        fi


        cd common


        if [ ! -d .git ]; then
          echo "WARNING: common is not git checkout"
          exit 0
        fi


        COMMIT_SHA=$(git rev-parse HEAD)


        echo "KERNEL_SOURCE_COMMIT=$COMMIT_SHA" >> "$GITHUB_ENV"
